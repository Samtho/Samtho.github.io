name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

# Permisos minimos que exige actions/deploy-pages
permissions:
  contents: read
  pages: write
  id-token: write

# Un despliegue a la vez, sin cancelar el que ya este en curso
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm

      - name: Instalar dependencias
        run: npm ci

      # Next genera los tipos de rutas (LayoutProps, PageProps) en .next/types.
      # tsc los necesita y aqui todavia no se ha hecho el build.
      - name: Generar tipos de rutas
        run: npx next typegen

      # Los tres pasos de calidad. Si alguno falla, no se publica nada.
      - name: Comprobar tipos
        run: npx tsc --noEmit

      - name: Tests unitarios
        run: npm run test

      - name: Build estatico
        run: npm run build

      - uses: actions/configure-pages@v6

      - uses: actions/upload-pages-artifact@v5
        with:
          path: ./out

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
